<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#010409"/>

  <!-- Neural network lines -->
  <line x1="8" y1="8"  x2="24" y2="8"  stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="8" y1="8"  x2="16" y2="24" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="24" y1="8" x2="16" y2="24" stroke="#58A6FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="8" y1="8"  x2="24" y2="20" stroke="#58A6FF" stroke-width="0.8" opacity="0.15"/>
  <line x1="24" y1="8" x2="8"  y2="20" stroke="#58A6FF" stroke-width="0.8" opacity="0.15"/>

  <!-- Nodes -->
  <circle cx="8"  cy="8"  r="2.5" fill="#58A6FF" opacity="0.5"/>
  <circle cx="24" cy="8"  r="2.5" fill="#58A6FF" opacity="0.5"/>
  <circle cx="8"  cy="20" r="2"   fill="#58A6FF" opacity="0.3"/>
  <circle cx="24" cy="20" r="2"   fill="#58A6FF" opacity="0.3"/>

  <!-- Central active node — bright -->
  <circle cx="16" cy="24" r="3.5" fill="#010409"/>
  <circle cx="16" cy="24" r="3.5" fill="#58A6FF" opacity="0.15"/>
  <circle cx="16" cy="24" r="2"   fill="#58A6FF"/>
</svg>
